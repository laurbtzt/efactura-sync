[project]
name = "efactura-sync"
version = "0.1.0"
description = "Sync Romanian ANAF e-Factura messages into a local archive."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "typer>=0.12",
    "platformdirs>=4.2",
]

[project.scripts]
efactura-sync = "efactura_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efactura_sync"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-lxml>=2024.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit real ANAF / SMTP",
]
addopts = "-q --strict-markers"
